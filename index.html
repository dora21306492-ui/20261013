<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- 設定網頁編碼為 UTF-8。 -->
  <meta charset="UTF-8">

  <!-- 啟用響應式版面。 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- 設定網頁標題。 -->
  <title>國小數學選擇題測驗</title>

  <!-- 預先連線至 Google Fonts。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- 預先連線至 Google Fonts 字型伺服器。 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- 載入繁體中文字型。 -->
  <link
    href="https://fonts.googleapis.com/css2?family=Chocolate+Classical+Sans&display=swap"
    rel="stylesheet"
  >

  <!-- 載入英文與數字字型。 -->
  <link
    href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&display=swap"
    rel="stylesheet"
  >

  <!-- 載入 p5.js。 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>

  <!-- 載入 sketch.js。 -->
  <script src="sketch.js"></script>

  <style>
    /* 讓 html 與 body 佔滿瀏覽器視窗。 */
    html,
    body {
      width: 100%;
      height: 100%;
    }

    /* 設定網頁基本樣式。 */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f7f9fc;
      font-family: "Chocolate Classical Sans", sans-serif;
    }

    /* 讓 p5.js 畫布以區塊方式顯示。 */
    canvas {
      display: block;
    }
  </style>
</head>

<body>
</body>
</html>
